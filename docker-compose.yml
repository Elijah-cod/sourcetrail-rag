services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sourcetrail
      POSTGRES_PASSWORD: sourcetrail
      POSTGRES_DB: sourcetrail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcetrail"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
