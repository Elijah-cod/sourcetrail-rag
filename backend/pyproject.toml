[project]
name = "sourcetrail-rag"
version = "0.1.0"
description = "Multi-source RAG knowledge base with hybrid search, reranking and verifiable citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "trafilatura>=2.3.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
